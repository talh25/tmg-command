<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TMG Command">
<meta name="theme-color" content="#070B12">
<meta name="description" content="Fan-made table companion for StarCraft: The Miniatures Game: game tracker, army lists, unit cards, rulebook, voices and music.">
<title>TMG Command</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <nav class="rail" id="nav" aria-label="Main"></nav>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="player" class="mini-player hidden" aria-label="Music player"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<noscript><p style="padding:24px;color:#fff">TMG Command needs JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
